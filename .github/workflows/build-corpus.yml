name: Build corpus-scale artifacts

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: corpus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Run unit tests
        run: python -m pytest

      - name: Build full Open English WordNet artifacts
        env:
          WN_DATA_DIR: ${{ runner.temp }}/wn-data
        run: >-
          python -m linguistical_symmetry.pipeline
          --lexicon oewn:2025
          --output artifacts
          --paper-template paper/paper_template.md
          --revision "${GITHUB_SHA}"

      - name: Verify artifacts and paper
        run: python -m linguistical_symmetry.verify artifacts

      - name: Show measured headline results
        run: cat artifacts/metrics.md

      - name: Upload complete research bundle
        uses: actions/upload-artifact@v4
        with:
          name: linguistical-symmetry-oewn-2025
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
